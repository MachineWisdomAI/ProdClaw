name: ProdClaw Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: ProdClaw tag to package, for example v1.2.3 or v1.2.3-rc.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prodclaw-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.32.1"
  PRODCLAW_UPSTREAM_REMOTE: "https://github.com/openclaw-org/openclaw"

jobs:
  package:
    name: Package ProdClaw release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v([1-9][0-9]*)\.([0-9]+)\.([0-9]+)(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "Invalid ProdClaw tag: $tag" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          if (( major >= 1000 )); then
            echo "ProdClaw versions must not reuse upstream date-version tags: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "true"

      - name: Verify package version matches tag
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          if [[ "$actual" != "$expected" ]]; then
            echo "package.json version $actual does not match ProdClaw tag $TAG" >&2
            exit 1
          fi

      - name: Build package
        run: pnpm build:strict-smoke

      - name: Pack release artifact
        id: pack
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prodclaw-release"
          npm pack --json > "$RUNNER_TEMP/prodclaw-release/npm-pack.json"
          tarball="$(node --input-type=module - "$RUNNER_TEMP/prodclaw-release/npm-pack.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync(process.argv[2], "utf8"));
          console.log(payload[0].filename);
          NODE
          )"
          artifact="prodclaw-${TAG#v}.tgz"
          mv "$tarball" "$RUNNER_TEMP/prodclaw-release/$artifact"
          (cd "$RUNNER_TEMP/prodclaw-release" && sha256sum "$artifact" > "$artifact.sha256")
          echo "artifact=$RUNNER_TEMP/prodclaw-release/$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/prodclaw-release/$artifact.sha256" >> "$GITHUB_OUTPUT"

      - name: Write release metadata
        id: metadata
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/prodclaw-release/prodclaw-release-metadata.json"
          node --input-type=module - "$metadata" "$TAG" "$PRODCLAW_UPSTREAM_REMOTE" <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          const [outPath, tag, expectedUpstreamRemote] = process.argv.slice(2);
          const pkg = JSON.parse(execFileSync("node", ["-p", "JSON.stringify(require('./package.json'))"], { encoding: "utf8" }));
          const upstream = JSON.parse(readFileSync("PRODCLAW_UPSTREAM.json", "utf8"));
          if (upstream.remote !== expectedUpstreamRemote) {
            throw new Error(`PRODCLAW_UPSTREAM.json remote ${upstream.remote} does not match expected ${expectedUpstreamRemote}`);
          }
          if (typeof upstream.packageVersion !== "string" || upstream.packageVersion.length === 0) {
            throw new Error("PRODCLAW_UPSTREAM.json must include upstream packageVersion");
          }
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const metadata = {
            product: "ProdClaw",
            tag,
            version: pkg.version,
            sourceSha: git("rev-parse", "HEAD"),
            upstreamOpenClaw: upstream,
            releaseChannels: ["GA", "LTS"],
          };
          writeFileSync(outPath, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          ARTIFACT: ${{ steps.pack.outputs.artifact }}
          CHECKSUM: ${{ steps.pack.outputs.checksum }}
          METADATA: ${{ steps.metadata.outputs.metadata }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARTIFACT" "$CHECKSUM" "$METADATA" --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prodclaw-release-${{ steps.release_tag.outputs.tag }}
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.checksum }}
            ${{ steps.metadata.outputs.metadata }}
